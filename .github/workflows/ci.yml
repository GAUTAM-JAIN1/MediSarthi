name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install tesseract + poppler (needed to import file_to_text.py)
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr poppler-utils

      - name: Install uv
        run: pip install uv

      - name: Install deps
        run: uv sync --no-dev

      - name: Run tests
        run: uv run pytest -v
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          MONGO_URI: ${{ secrets.MONGO_URI }}

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        # adjust if your actual inner folder name differs
        working-directory: frontend/frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci
      - run: npm run build

  docker-build:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t medisarthi-backend ./backend

      - name: Build frontend image
        run: docker build -t medisarthi-frontend ./frontend/frontend