name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install tesseract + poppler + portaudio (needed to import file_to_text.py / speech_to_text.py)
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr poppler-utils libportaudio2

      - name: Install uv
        run: pip install uv

      - name: Install deps
        run: uv sync --no-dev

      - name: Run tests
        env:
          APP_ENV: development
          JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY || 'ci-test-only-secret-key-do-not-use-in-prod-0123456789' }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          MONGO_URI: ${{ secrets.MONGO_URI }}
        run: |
          echo "APP_ENV=$APP_ENV"
          echo "JWT_SECRET_KEY length=${#JWT_SECRET_KEY}"
          uv run pytest -v

      - name: Dump OpenAPI and package versions (diagnostic)
        if: always()
        env:
          APP_ENV: development
          JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY || 'ci-test-only-secret-key-do-not-use-in-prod-0123456789' }}
        run: |
          uv run python -W ignore -c "import sys,json,hashlib; import fastapi, pydantic, starlette; sys.path.insert(0,'src'); from agents.main import app; s=json.dumps(app.openapi(), sort_keys=True, indent=2); print('VERSIONS fastapi=%s pydantic=%s starlette=%s' % (fastapi.__version__, pydantic.__version__, starlette.__version__)); print('OPENAPI_HASH', hashlib.sha256(s.encode('utf-8')).hexdigest()); print(s)" > openapi_ci.txt
          head -n 2 openapi_ci.txt

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        # adjust if your actual inner folder name differs
        working-directory: frontend/frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci
      - run: npm run build

  docker-build:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t medisarthi-backend ./backend

      - name: Build frontend image
        run: docker build -t medisarthi-frontend ./frontend/frontend