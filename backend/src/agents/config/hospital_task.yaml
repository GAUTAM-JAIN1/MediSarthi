research_task:
  description: >
    Search for top hospitals in the given city:{city}, state:{state}, and country:{country}.
    The tool returns each hospital's name, address, and phone number (or "Not available" if
    OpenStreetMap has no phone on file for it) - pass all of this through, do not drop the
    phone information.
  expected_output: >
    A list of hospitals, each with name, address, and phone number exactly as returned by the
    tool.
  agent: hospital_finder
  markdown: true

reporting_task:
  description: >
    Summarize the hospital data into a short report.

    CRITICAL FORMATTING RULE - another program parses your output automatically, so follow this
    exact format for every hospital, with no deviation in style:

      * **Hospital Name**: Address | Phone: phone-number-or-Not-available

    One hospital per line. Always wrap the name in double asterisks (**like this**) - never use
    backticks, italics, or any other style for the name. Always include "| Phone: ..." after the
    address, even when the value is "Not available". Do not add commentary, disclaimers, or notes
    before or after the list - the list itself is the entire report.
  expected_output: >
    A markdown bullet list, one hospital per line, in the exact format:
    "* **Hospital Name**: Address | Phone: phone-number-or-Not-available". Nothing else.
  agent: hospital_reporter
  markdown: true