server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback — without this, refreshing on /doctor-visit/:token or any
    # other client-side route 404s at the nginx level instead of reaching
    # React Router.
    location / {
        try_files $uri $uri/ /index.html;
    }
}